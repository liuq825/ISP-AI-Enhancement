name: CI

# 每次提交与拉取请求都执行静态检查、中文说明门禁和 CPU 单元测试。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # pruning 额外依赖用于执行真实 DepGraph 回归，而非跳过可选后端测试。
      - run: python -m pip install -e ".[quality,pruning,data,export]"
      - run: ruff check .
      - run: pytest
