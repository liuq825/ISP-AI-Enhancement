# 极小 Student 的结构感知剪枝目标：浅层与末端保持原宽，中深层承担约 15% 参数压缩。
# 仅验证物理剪枝和后续训练/QAT 链路；正式模型使用 model_student_structaware15.yaml。
model:
  name: nafnet_raw
  input_channels: 16
  output_channels: 4
  width: 8
  encoder_blocks: [1, 1, 1, 1]
  middle_blocks: 1
  decoder_blocks: [1, 1, 1, 1]
  expansion_spec:
    enc1: [8]
    enc2: [16]
    enc3: [30]
    enc4: [56]
    middle: [94]
    dec1: [56]
    dec2: [30]
    dec3: [16]
    dec4: [8]
