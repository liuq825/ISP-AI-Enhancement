# 从结构感知物理剪枝 checkpoint 微调参考 P3；先恢复画质，再进入 QAT。
seed: 20260726
device: cuda
model_config: configs/model_student_structaware15.yaml
initial_checkpoint: checkpoints/student_structaware15.pt
context_config: configs/context.yaml
manifest: data/production/manifest.jsonl
output_dir: runs/student_structaware15_finetune
data_policy:
  purpose: commercial_grade
  catalog: resources/datasets.yaml
epochs: 30
batch_size: 1
gradient_accumulation_steps: 8
num_workers: 2
crop_size: 256
learning_rate: 0.00005
weight_decay: 0.0
amp: true
log_every: 20
save_every_epochs: 1
scheduler:
  type: cosine
  t_max: 30
  eta_min: 0.000001
loss:
  charbonnier: 1.0
  gradient: 0.10
  color: 0.05
