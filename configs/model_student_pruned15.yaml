model:
  name: nafnet_raw
  input_channels: 16
  output_channels: 4
  width: 32
  encoder_blocks: [2, 2, 4, 8]
  middle_blocks: 4
  decoder_blocks: [2, 2, 2, 2]
  # Deep-to-shallow decoder order. All values are post-SimpleGate hidden widths.
  expansion_spec:
    enc1: [32, 32]
    enc2: [64, 64]
    enc3: [112, 112, 112, 112]
    enc4: [224, 224, 224, 224, 224, 224, 224, 224]
    middle: [416, 416, 432, 432]
    dec1: [224, 224]
    dec2: [112, 112]
    dec3: [64, 64]
    dec4: [32, 32]
