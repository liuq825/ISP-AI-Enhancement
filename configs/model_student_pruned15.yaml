# 约 15% 参数物理剪枝的学生目标规格；宽度表示 SimpleGate 之后的逻辑通道数。
model:
  name: nafnet_raw
  input_channels: 16
  output_channels: 4
  width: 32
  encoder_blocks: [2, 2, 4, 8]
  middle_blocks: 4
  decoder_blocks: [2, 2, 2, 2]
  # 解码器按深到浅排列；全部数值均为 SimpleGate 之后的隐藏通道宽度。
  expansion_spec:
    enc1: [32, 32]
    enc2: [64, 64]
    enc3: [112, 112, 112, 112]
    enc4: [224, 224, 224, 224, 224, 224, 224, 224]
    middle: [416, 416, 432, 432]
    dec1: [224, 224]
    dec2: [112, 112]
    dec3: [64, 64]
    dec4: [32, 32]
