# 学生模型的商用品质研发配置；该用途不等于已经取得正式生产授权。
seed: 20260726
device: cuda
student_config: configs/model_student.yaml
teacher_config: configs/model_teacher.yaml
teacher_checkpoint: checkpoints/teacher.pt
context_config: configs/context.yaml
manifest: data/production/manifest.jsonl
output_dir: runs/student_distill
data_policy:
  # commercial_grade 校验公开数据研发用途，但不触发未来量产审批门禁。
  purpose: commercial_grade
  catalog: resources/datasets.yaml
epochs: 100
batch_size: 8
num_workers: 8
crop_size: 256
learning_rate: 0.0001
weight_decay: 0.0
amp: true
scheduler:
  # 每个 epoch 完成 optimizer 更新后推进，无周期重启。
  type: cosine
  t_max: 100
  eta_min: 0.000001
loss:
  # 前三项为真值监督，后两项分别约束教师输出和中间特征。
  charbonnier: 1.0
  gradient: 0.10
  color: 0.05
  teacher_output: 0.30
  teacher_feature: 0.10
  feature_keys: [enc2, enc4, middle, dec2]
