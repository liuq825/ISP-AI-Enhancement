# 16 通道输入契约的归一化与相机嵌入注册表；训练和部署必须使用同一版本。
context:
  # 曝光比先转为 EV，再用 [-max_abs_ev, +max_abs_ev] 映射到 [0, 1]。
  max_abs_ev: 8.0
  wb_ratio_min: 0.25
  wb_ratio_max: 4.0
  camera_embeddings:
    # 冒烟嵌入没有相机语义，只用于流水线自检。
    smoke_sensor: [0.0, 0.0, 0.0, 0.0]
    # SIDD 代号采用确定性占位编码；目标麒麟设备需以标定/学习结果替换。
    sidd_GP: [-1.0, -1.0, -1.0, -1.0]
    sidd_IP: [-1.0, -1.0, 1.0, 1.0]
    sidd_S6: [-1.0, 1.0, -1.0, 1.0]
    sidd_N6: [1.0, -1.0, 1.0, -1.0]
    sidd_G4: [1.0, 1.0, 1.0, 1.0]
  mode_codes:
    # 模式编码占第 15 通道，第 16 通道固定为有效区域掩码。
    single: 0.0
    hdr: 0.5
    mfnr: 1.0
