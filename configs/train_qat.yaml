# 从已微调的物理剪枝 FP32 权重开始 QAT；不能直接用随机初始化模型。
seed: 20260726
device: cuda
model_config: configs/model_student_structaware15.yaml
# 必须使用结构感知剪枝后已经完成 FP32 恢复微调的最佳权重。
initial_checkpoint: runs/student_structaware15_finetune/best.pt
qat_config: configs/qat.yaml
context_config: configs/context.yaml
manifest: data/production/manifest.jsonl
output_dir: runs/student_structaware15_qat
data_policy:
  purpose: commercial_grade
  catalog: resources/datasets.yaml
epochs: 30
batch_size: 1
gradient_accumulation_steps: 8
num_workers: 2
crop_size: 256
learning_rate: 0.00002
weight_decay: 0.0
amp: true
log_every: 20
save_every_epochs: 1
scheduler:
  type: cosine
  t_max: 30
  eta_min: 0.0000001
loss:
  charbonnier: 1.0
  gradient: 0.10
  color: 0.05
