# 单轮 CPU 冒烟训练：验证数据、模型、损失和检查点链路，不代表收敛质量。
seed: 20260726
device: cpu
model_config: configs/model_smoke.yaml
context_config: configs/context.yaml
manifest: data/smoke/manifest.jsonl
output_dir: runs/smoke
data_policy:
  # 冒烟用途只能使用数据目录中明确登记的合成测试集。
  purpose: smoke
  catalog: resources/datasets.yaml
epochs: 1
batch_size: 1
num_workers: 0
crop_size: 64
learning_rate: 0.0002
weight_decay: 0.0
amp: false
log_every: 1
save_every_epochs: 1
loss:
  charbonnier: 1.0
  gradient: 0.1
  color: 0.05
